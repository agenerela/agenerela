# Ollama for Agenerela's live runs, served from the RTX 5080 machine to other machines.
#
# A self-contained stack: its own containers, port and model volume. It never touches
# the Ollama app installed on this machine, which keeps its own models and port 11434.
# Run every command from this folder; README.md walks through setup.
#
#   ollama   Ollama itself, at a pinned version, with the settings every result so far
#            was measured with. It publishes no port: only the gateway can reach it.
#   gateway  Caddy in front of Ollama's API: the one port other machines can reach.
#            Every request must carry AGENERELA_OLLAMA_API_KEY from .env.

name: agenerela-ollama

services:
  ollama:
    # The version every result is tied to. Change it only on purpose, in its own pull
    # request, then re-run tools/benchmarks/schema_visibility_probe.py (AGENTS.md) and
    # raise OLLAMA_VERSION in tools/live-runs/model-sweep/sweep_one.sh to match.
    image: ollama/ollama:0.40.14
    container_name: agenerela-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434          # inside the container; nothing publishes it
      # The settings the model-sweep kit starts `ollama serve` with
      # (tools/live-runs/model-sweep/README.md, step 1):
      OLLAMA_GO_TEMPLATE: "1"             # no model has its keys sorted (findings, 9 November)
      OLLAMA_CONTEXT_LENGTH: "16384"      # what the Ollama app adds on Windows
      OLLAMA_NO_CLOUD: "0"                # likewise
    volumes:
      - models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  gateway:
    image: caddy:2.11.7-alpine
    container_name: agenerela-ollama-gateway
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      API_KEY: ${AGENERELA_OLLAMA_API_KEY:?AGENERELA_OLLAMA_API_KEY is empty. Run setup.ps1, which writes one to .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${#API_KEY}" -lt 32 ]; then
          echo "AGENERELA_OLLAMA_API_KEY is shorter than 32 characters; refusing to start. Run setup.ps1." >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${OLLAMA_API_BIND:-0.0.0.0}:${OLLAMA_API_PORT:-11436}:8080"

volumes:
  models:
