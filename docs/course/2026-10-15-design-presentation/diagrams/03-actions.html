<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Action vocabulary</title>
<link rel="stylesheet" href="fig.css">
<style>body{width:1200px;height:460px}</style></head>
<body>
<!-- Action vocabulary (Timothy Brustinov): two front doors produce one ActionDefinition, the
     registry binds each id to the game's handler. As merged: #4, #6, #15, #50 (DR-011).
     The guard's verbs follow the walkthrough (docs/design/workflow.html, steps 03 and 05). -->
<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5bd6"/></marker>
  <symbol id="lol" viewBox="0 0 26 14"><line x1="1" y1="7" x2="14" y2="7" stroke="#4a4a4a" stroke-width="2"/><circle cx="19" cy="7" r="5.2" fill="#fff" stroke="#4a4a4a" stroke-width="2"/></symbol>
</defs>

<!-- ===== code door ===== -->
<rect x="2" y="2" width="390" height="220" rx="12" class="box"/>
<rect x="14" y="14" width="366" height="34" rx="7" fill="#1c1c1c"/>
<text x="28" y="37" class="bartxt">CODE DOOR</text>
<text x="368" y="37" text-anchor="end" class="mono" style="font-size:14px;fill:#ccc">VillageGuard.cs</text>
<g class="mono" style="font-size:14px" xml:space="preserve">
  <text xml:space="preserve" x="26" y="76" class="mono"><tspan class="bluet" font-weight="700">[AgentAction</tspan>("move_to",</text>
  <text xml:space="preserve" x="26" y="96" class="mono">    "Walk to a named place.",</text>
  <text xml:space="preserve" x="26" y="116" class="mono">    RequiresTarget = true)]</text>
  <text xml:space="preserve" x="26" y="140" class="mono"><tspan class="bluet" font-weight="700">[Example</tspan>("Head over to the {0}.",</text>
  <text xml:space="preserve" x="26" y="160" class="mono">    "tower", "bridge")]</text>
  <text xml:space="preserve" x="26" y="184" class="mono">public void MoveTo(AgentContext ctx,</text>
  <text xml:space="preserve" x="26" y="204" class="mono">                   Transform t) =&gt; …</text>
</g>

<!-- ===== asset door ===== -->
<rect x="2" y="238" width="390" height="220" rx="12" class="box"/>
<rect x="14" y="250" width="366" height="34" rx="7" fill="#1c1c1c"/>
<text x="28" y="273" class="bartxt">ASSET DOOR</text>
<text x="368" y="273" text-anchor="end" class="mono" style="font-size:14px;fill:#ccc">move_to.asset</text>
<g>
  <text x="26" y="314" class="s">Id</text>
  <rect x="150" y="296" width="226" height="26" rx="4" fill="#fff" stroke="#c2c2c2" stroke-width="1.5"/>
  <text x="160" y="314" class="mono" style="font-size:14px">move_to</text>
  <text x="26" y="346" class="s">Description</text>
  <rect x="150" y="328" width="226" height="26" rx="4" fill="#fff" stroke="#c2c2c2" stroke-width="1.5"/>
  <text x="160" y="346" style="font-size:14px">Walk to a named place.</text>
  <text x="26" y="378" class="s">Requires target</text>
  <rect x="150" y="362" width="20" height="20" rx="3" fill="#1f5bd6"/>
  <path d="M154,372 L159,377 L167,367" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="26" y="410" class="s">Example</text>
  <rect x="150" y="392" width="226" height="26" rx="4" fill="#fff" stroke="#c2c2c2" stroke-width="1.5"/>
  <text x="160" y="410" style="font-size:14px">Head over to the {0}.</text>
  <text x="26" y="440" class="s">Sensible targets</text>
  <rect x="150" y="426" width="62" height="20" rx="10" class="chip"/><text x="181" y="440" text-anchor="middle" class="mono" style="font-size:13px">tower</text>
  <rect x="218" y="426" width="68" height="20" rx="10" class="chip"/><text x="252" y="440" text-anchor="middle" class="mono" style="font-size:13px">bridge</text>
</g>

<!-- ===== both doors into one type ===== -->
<path d="M396,112 C440,112 436,206 466,206" class="blue" marker-end="url(#ab)"/>
<path d="M396,348 C440,348 436,264 466,264" class="blue" marker-end="url(#ab)"/>

<text x="589" y="104" text-anchor="middle" class="blbl">one type, whichever door</text>
<rect x="474" y="118" width="230" height="222" rx="14" fill="#1c1c1c"/>
<text x="589" y="156" text-anchor="middle" style="font-size:21px;font-weight:700;fill:#fff">ActionDefinition</text>
<text x="589" y="178" text-anchor="middle" style="font-size:13px;fill:#aaa;letter-spacing:1px">PLAIN DATA · NO SCENE</text>
<g class="mono" style="font-size:14px">
  <text x="496" y="214" class="mono" style="fill:#ddd">Id</text>
  <text x="496" y="238" class="mono" style="fill:#ddd">Description</text>
  <text x="496" y="262" class="mono" style="fill:#ddd">RequiresTarget</text>
  <text x="496" y="286" class="mono" style="fill:#ddd">ExampleStimulus</text>
  <text x="496" y="310" class="mono" style="fill:#ddd">PreferredExampleTargets</text>
</g>
<rect x="474" y="356" width="230" height="58" rx="10" fill="#e8effc" stroke="#1f5bd6" stroke-width="2"/>
<text x="589" y="380" text-anchor="middle" style="font-size:14px;font-weight:700">Same id through both doors?</text>
<text x="589" y="401" text-anchor="middle" style="font-size:14px">asset's wording, method's code</text>

<line x1="708" y1="229" x2="752" y2="229" class="blue" marker-end="url(#ab)"/>

<!-- ===== registry ===== -->
<rect x="760" y="96" width="222" height="270" rx="12" class="soft"/>
<text x="778" y="126" class="h2">ActionRegistry</text>
<text x="778" y="148" class="s">each id bound to its code</text>
<g class="mono" style="font-size:14px">
  <rect x="772" y="164" width="198" height="32" rx="6" fill="#fff" stroke="#c2c2c2" stroke-width="1.5"/>
  <text x="782" y="185" class="mono">follow_player</text><text x="960" y="185" text-anchor="end" class="mono" style="fill:#555">Follow()</text>
  <rect x="772" y="202" width="198" height="32" rx="6" fill="#fff" stroke="#1f5bd6" stroke-width="2.2"/>
  <text x="782" y="223" class="mono" font-weight="700">move_to</text><text x="960" y="223" text-anchor="end" class="mono" style="fill:#555">MoveTo()</text>
  <rect x="772" y="240" width="198" height="32" rx="6" fill="#fff" stroke="#c2c2c2" stroke-width="1.5"/>
  <text x="782" y="261" class="mono">attack_target</text><text x="960" y="261" text-anchor="end" class="mono" style="fill:#555">Attack()</text>
  <rect x="772" y="278" width="198" height="32" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="782" y="299" class="mono" style="fill:#777">none</text><text x="960" y="299" text-anchor="end" style="font-size:13px;fill:#777;font-style:italic">reserved, added last</text>
</g>
<text x="778" y="334" class="xs">order is stable: it becomes</text>
<text x="778" y="352" class="xs">the order the model sees</text>

<line x1="986" y1="229" x2="1010" y2="229" class="blue" marker-end="url(#ab)"/>

<!-- ===== your code ===== -->
<rect x="1016" y="60" width="182" height="350" rx="12" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
<rect x="1028" y="72" width="158" height="34" rx="7" fill="#1c1c1c"/>
<text x="1042" y="95" class="bartxt">YOUR CODE</text>
<use href="#lol" x="1030" y="124" width="26" height="14"/>
<text x="1060" y="136" class="mono" style="font-size:14px;font-weight:700">IActionHandler</text>
<text x="1032" y="170" class="mono" style="font-size:14px">IsAvailable(ctx)</text>
<text x="1032" y="190" class="s">legal right now?</text>
<text x="1032" y="222" class="mono" style="font-size:14px">Execute(ctx, d)</text>
<text x="1032" y="242" class="s">runs your Unity code</text>
<line x1="1032" y1="262" x2="1182" y2="262" stroke="#ccc" stroke-width="2"/>
<text x="1032" y="288" class="xs">A handler can be</text>
<text x="1032" y="310" class="s">· a tagged method</text>
<text x="1032" y="332" class="s">· two lambdas</text>
<text x="1032" y="354" class="s">· a MonoBehaviour</text>
<text x="1032" y="376" class="s">· a plain class,</text>
<text x="1032" y="396" class="s">  e.g. a country</text>
</svg>
</body></html>
