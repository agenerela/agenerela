<text x="640.0" y="126.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#6B625A" font-weight="normal" text-anchor="middle" font-style="italic">Year 2 · every move, every letter, every refusal</text>
