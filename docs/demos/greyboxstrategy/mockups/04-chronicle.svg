<text x="186.0" y="186.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#2B2622" font-weight="700" text-anchor="start">Autumn, Year 2</text>
<line x1="186.0" y1="194.0" x2="1094.0" y2="194.0" stroke="#B8954A" stroke-width="0.8"/>
<circle cx="200.0" cy="213.0" r="7.0" fill="#2E8C85" stroke="none" stroke-width="1"/>
<text x="216.0" y="217.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#6B625A" font-weight="700" text-anchor="start">LETTER</text>
<text x="300.0" y="217.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2B2622" font-weight="normal" text-anchor="start">Orm to valen: “Your iron rusts; our silver does not. Pay for your peace.”</text>
<circle cx="200.0" cy="249.0" r="7.0" fill="#A8452F" stroke="none" stroke-width="1"/>
<text x="216.0" y="253.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#6B625A" font-weight="700" text-anchor="start">MOVE</text>
<text x="300.0" y="253.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2B2622" font-weight="normal" text-anchor="start">Valen rejected the terms. “We do not buy what we can hold.”</text>
<circle cx="200.0" cy="285.0" r="7.0" fill="#C8963A" stroke="none" stroke-width="1"/>
<text x="216.0" y="289.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#6B625A" font-weight="700" text-anchor="start">MOVE</text>
<text x="300.0" y="289.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2B2622" font-weight="normal" text-anchor="start">Kharsa raised two levies at ashkar.</text>
<circle cx="200.0" cy="321.0" r="7.0" fill="#3B6EA8" stroke="none" stroke-width="1"/>
<text x="216.0" y="325.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#6B625A" font-weight="700" text-anchor="start">YOU</text>
<text x="300.0" y="325.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2B2622" font-weight="normal" text-anchor="start">You sent thornwood 20 gold.</text>
<text x="186.0" y="372.0" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#2B2622" font-weight="700" text-anchor="start">Winter, Year 2</text>
<line x1="186.0" y1="380.0" x2="1094.0" y2="380.0" stroke="#B8954A" stroke-width="0.8"/>
<circle cx="200.0" cy="399.0" r="7.0" fill="#A8452F" stroke="none" stroke-width="1"/>
<text x="216.0" y="403.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#6B625A" font-weight="700" text-anchor="start">MOVE</text>
<text x="300.0" y="403.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2B2622" font-weight="normal" text-anchor="start">Valen fortified high_barrow. “Let orm break its teeth on our walls.”</text>
<circle cx="200.0" cy="435.0" r="7.0" fill="#C8963A" stroke="none" stroke-width="1"/>
<text x="216.0" y="439.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#6B625A" font-weight="700" text-anchor="start">BATTLE</text>
<text x="300.0" y="439.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2B2622" font-weight="normal" text-anchor="start">Kharsa marched on gull_reach: 4 against 3, the dice 5 and 2. gull_reach falls to kharsa.</text>
<circle cx="200.0" cy="471.0" r="7.0" fill="#2E8C85" stroke="none" stroke-width="1"/>
<text x="216.0" y="475.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#6B625A" font-weight="700" text-anchor="start">LETTER</text>
<text x="300.0" y="475.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2B2622" font-weight="normal" text-anchor="start">Orm refused valen’s offer of peace.</text>
<rect x="180.0" y="495.0" width="920.0" height="34.0" rx="4" fill="#FFF4DE" stroke="#C9821B" stroke-width="1"/>
<circle cx="200.0" cy="507.0" r="7.0" fill="#A8452F" stroke="none" stroke-width="1"/>
<text x="216.0" y="511.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#6B625A" font-weight="700" text-anchor="start">CONTAINED</text>
<text x="300.0" y="511.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2B2622" font-weight="normal" text-anchor="start">Valen chose to declare war on aster. Truce guard: the truce holds until summer of year 3.</text>
<rect x="1000.0" y="499.0" width="72.0" height="18.0" rx="9.0" fill="#C9821B" stroke="none" stroke-width="1"/><text x="1036.0" y="512.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">TruceGuard</text>
<circle cx="200.0" cy="543.0" r="7.0" fill="#4F7A3A" stroke="none" stroke-width="1"/>
<text x="216.0" y="547.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#6B625A" font-weight="700" text-anchor="start">MOVE</text>
<text x="300.0" y="547.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2B2622" font-weight="normal" text-anchor="start">Thornwood kept its counsel.</text>
<rect x="180.0" y="567.0" width="920.0" height="34.0" rx="4" fill="#F7E3DE" stroke="#B23A3A" stroke-width="1"/>
<circle cx="200.0" cy="579.0" r="7.0" fill="#C8963A" stroke="none" stroke-width="1"/>
<text x="216.0" y="583.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" fill="#6B625A" font-weight="700" text-anchor="start">REFUSED</text>
<text x="300.0" y="583.0" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#2B2622" font-weight="normal" text-anchor="start">Kharsa’s levies never came: the treasury was empty when the season turned.</text>
<rect x="1000.0" y="571.0" width="54.6" height="18.0" rx="9.0" fill="#B23A3A" stroke="none" stroke-width="1"/><text x="1027.3" y="584.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#fff" font-weight="600" text-anchor="middle">Execute</text>
<text x="640.0" y="690.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#6B625A" font-weight="normal" text-anchor="middle" font-style="italic">Amber: a guard stopped a legal but wrong move (contained). Red: the game refused a move at execution.</text>
</svg>
