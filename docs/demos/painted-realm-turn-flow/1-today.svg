<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 436" width="1280" height="436" role="img" aria-labelledby="t d">
  <title id="t">Today: one turn in rule mode, between two councils</title>
  <desc id="d">A timeline of one turn today. The council opens and you plan while the five rival courts give their first order. After End turn you wait while the rivals give 8 to 13 more orders, then the rules resolve the turn at once and the screen plays it back for about half a minute: this turn&#x27;s upkeep news, every ruler&#x27;s orders one by one, then the march and the battles. The next council opens when the playback ends.</desc>
  <style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="1280" height="436" rx="10" fill="#0d1117"/>
  <text x="20" y="34" font-size="18" font-weight="600" fill="#e6edf3">Today: one turn in rule mode, between two councils</text>
  <rect x="12" y="56" width="1256" height="52" rx="6" fill="#161b22"/>
  <text x="20" y="82" font-size="13" font-weight="600" fill="#e6edf3" dominant-baseline="middle">You</text>
  <rect x="12" y="118" width="1256" height="100" rx="6" fill="#161b22"/>
  <text x="20" y="161" font-size="13" font-weight="600" fill="#e6edf3" dominant-baseline="middle">Rival rulers</text>
  <text x="20" y="178" font-size="11" fill="#8b949e" dominant-baseline="middle">the model, one call at a time</text>
  <rect x="12" y="228" width="1256" height="36" rx="6" fill="#161b22"/>
  <text x="20" y="246" font-size="13" font-weight="600" fill="#e6edf3" dominant-baseline="middle">The rules</text>
  <rect x="12" y="274" width="1256" height="68" rx="6" fill="#161b22"/>
  <text x="20" y="308" font-size="13" font-weight="600" fill="#e6edf3" dominant-baseline="middle">The screen</text>
  <line x1="170.0" y1="52" x2="170.0" y2="350" stroke="#f0f6fc" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/>
  <line x1="604.4" y1="52" x2="604.4" y2="350" stroke="#f0f6fc" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/>
  <line x1="756.4" y1="52" x2="756.4" y2="350" stroke="#f0f6fc" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/>
  <line x1="1256.0" y1="52" x2="1256.0" y2="350" stroke="#f0f6fc" stroke-width="1.5" stroke-dasharray="4 4" opacity=".6"/>
  <rect x="172.0" y="61" width="430.4" height="42" rx="5" fill="#12351f" stroke="#2ea043"/>
  <text x="387.2" y="74.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">Council: one court order, and an order for each army that gets a</text>
  <text x="387.2" y="90.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">writ. As long as you like</text>
  <rect x="606.4" y="61" width="148.0" height="42" rx="5" fill="#3b2a08" stroke="#d29922"/>
  <text x="680.4" y="74.0" font-size="12" fill="#f0d48a" text-anchor="middle" dominant-baseline="middle">Wait. A treaty card</text>
  <text x="680.4" y="90.0" font-size="12" fill="#f0d48a" text-anchor="middle" dominant-baseline="middle">may open</text>
  <rect x="758.4" y="61" width="495.6" height="42" rx="5" fill="#161b22" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="1006.2" y="82.0" font-size="12" fill="#8b949e" text-anchor="middle" dominant-baseline="middle">Watch. No orders until the playback ends</text>
  <rect x="172.0" y="123" width="148.0" height="90" rx="5" fill="#11264f" stroke="#4d8eff"/>
  <text x="246.0" y="160.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">Round 1: five court</text>
  <text x="246.0" y="176.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">orders, 2.4 s</text>
  <rect x="606.4" y="123" width="148.0" height="90" rx="5" fill="#11264f" stroke="#4d8eff"/>
  <text x="680.4" y="136.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">Later rounds: armies,</text>
  <text x="680.4" y="152.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">second court orders,</text>
  <text x="680.4" y="168.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">treaty answers. 8 to</text>
  <text x="680.4" y="184.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">13 calls, 3.7 to 6.5</text>
  <text x="680.4" y="200.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">s</text>
  <rect x="823.6" y="123" width="191.5" height="90" rx="5" fill="#11264f" stroke="#4d8eff"/>
  <text x="919.3" y="152.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">Storyteller, then next</text>
  <text x="919.3" y="168.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">turn&#x27;s round 1, behind the</text>
  <text x="919.3" y="184.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">playback</text>
  <rect x="172.0" y="233" width="430.4" height="26" rx="5" fill="#21262d" stroke="#6e7681"/>
  <text x="387.2" y="246.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">One snapshot, taken after upkeep. Nothing lands</text>
  <rect x="758.4" y="233" width="61.2" height="26" rx="5" fill="#21262d" stroke="#6e7681"/>
  <text x="789.0" y="246.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">Resolve</text>
  <rect x="823.6" y="233" width="191.5" height="26" rx="5" fill="#21262d" stroke="#6e7681"/>
  <text x="919.3" y="246.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">Next upkeep, next snapshot</text>
  <rect x="172.0" y="279" width="430.4" height="58" rx="5" fill="#2a1d47" stroke="#a371f7"/>
  <text x="387.2" y="300.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">Council panel. The map already shows upkeep&#x27;s results, not yet</text>
  <text x="387.2" y="316.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">told as news</text>
  <rect x="606.4" y="279" width="148.0" height="58" rx="5" fill="#3b2a08" stroke="#d29922"/>
  <text x="680.4" y="292.0" font-size="12" fill="#f0d48a" text-anchor="middle" dominant-baseline="middle">&quot;Your order is in.</text>
  <text x="680.4" y="308.0" font-size="12" fill="#f0d48a" text-anchor="middle" dominant-baseline="middle">The rulers are</text>
  <text x="680.4" y="324.0" font-size="12" fill="#f0d48a" text-anchor="middle" dominant-baseline="middle">deciding&quot;</text>
  <rect x="758.4" y="279" width="93.7" height="58" rx="5" fill="#2a1d47" stroke="#a371f7"/>
  <text x="805.3" y="300.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">This turn&#x27;s</text>
  <text x="805.3" y="316.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">upkeep news</text>
  <rect x="856.2" y="279" width="278.4" height="58" rx="5" fill="#2a1d47" stroke="#a371f7"/>
  <text x="995.4" y="300.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">Every ruler&#x27;s orders, a banner at a time:</text>
  <text x="995.4" y="316.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">about 30 s</text>
  <rect x="1138.5" y="279" width="115.5" height="58" rx="5" fill="#2a1d47" stroke="#a371f7"/>
  <text x="1196.3" y="300.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">March, battles,</text>
  <text x="1196.3" y="316.0" font-size="12" fill="#e6edf3" text-anchor="middle" dominant-baseline="middle">land: 7 s</text>
  <text x="170.0" y="366" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="start">Council opens</text>
  <text x="604.4" y="366" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="middle">End turn</text>
  <text x="756.4" y="366" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="middle">The turn resolves, at once</text>
  <text x="1256.0" y="366" font-size="12" font-weight="600" fill="#f0f6fc" text-anchor="end">Next council opens</text>
  <text x="20" y="390" font-size="13" fill="#c9d1d9">Not to scale. Model times are from a rule game against five qwen3.5:4b rivals on the RTX 5080, 16 November. The playback is about 37 s a turn at 1× in the games played for this page.</text>
  <rect x="20" y="408" width="16" height="12" rx="3" fill="#12351f" stroke="#2ea043"/>
  <text x="42" y="418" font-size="12" fill="#8b949e">you</text>
  <rect x="85.2" y="408" width="16" height="12" rx="3" fill="#11264f" stroke="#4d8eff"/>
  <text x="107.2" y="418" font-size="12" fill="#8b949e">model rulers (qwen3.5:4b)</text>
  <rect x="291.2" y="408" width="16" height="12" rx="3" fill="#21262d" stroke="#6e7681"/>
  <text x="313.2" y="418" font-size="12" fill="#8b949e">the rules</text>
  <rect x="394.79999999999995" y="408" width="16" height="12" rx="3" fill="#2a1d47" stroke="#a371f7"/>
  <text x="416.79999999999995" y="418" font-size="12" fill="#8b949e">what the screen shows</text>
  <rect x="575.1999999999999" y="408" width="16" height="12" rx="3" fill="#3b2a08" stroke="#d29922"/>
  <text x="597.1999999999999" y="418" font-size="12" fill="#8b949e">waiting</text>
  <rect x="666.0" y="408" width="16" height="12" rx="3" fill="#161b22" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="688.0" y="418" font-size="12" fill="#8b949e">nothing to do</text>
</svg>
