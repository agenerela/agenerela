<!-- ============ pipeline: the Agenerela package ============ -->
<g>

  <text x="492" y="405" font-size="35" font-weight="700" fill="#1c1c1c">Agent</text>
  <text x="492" y="432" font-size="17" fill="#4a4a4a">who it is · what it remembers and sees</text>
  <use href="#lol" x="492" y="443" width="26" height="14"/>
  <text x="522" y="454" class="m" font-size="14.5" fill="#4a4a4a">IMemoryStrategy</text>
  <use href="#lol" x="664" y="443" width="26" height="14"/>
  <text x="694" y="454" class="m" font-size="14.5" fill="#4a4a4a">IObservationSource</text>

  <!-- 3 · Actions & targets -->
  <rect x="416" y="489" width="448" height="100" rx="10" fill="#fff" stroke="#1c1c1c" stroke-width="2.5"/>
  <circle cx="452" cy="539" r="21" fill="#1f5fd1"/><text x="452" y="547" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3</text>

  <text x="492" y="579" class="m" font-size="14.5" fill="#4a4a4a">ActionRegistry</text>

  <circle cx="452" cy="664" r="21" fill="#1f5fd1"/><text x="452" y="672" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">4</text>

  <text x="492" y="704" class="m" font-size="14.5" fill="#4a4a4a">DecisionSchema → JSON Schema / GBNF</text>

  <text x="492" y="780" font-size="35" font-weight="700" fill="#1c1c1c">Queue &amp; provider</text>
  <text x="492" y="807" font-size="17" fill="#4a4a4a">player-facing first · cancel · budget</text>
  <use href="#lol" x="492" y="818" width="26" height="14"/>
  <text x="522" y="829" class="m" font-size="14.5" fill="#4a4a4a">ILLMProvider</text>

  <rect x="416" y="864" width="448" height="100" rx="10" fill="#fff" stroke="#1c1c1c" stroke-width="2.5"/>

  <text x="492" y="905" font-size="35" font-weight="700" fill="#1c1c1c">Guards</text>
  <text x="492" y="932" font-size="17" fill="#4a4a4a">legal? target named? if not → <tspan class="m" font-size="16">none</tspan></text>
  <use href="#lol" x="492" y="943" width="26" height="14"/>

<!-- ============ your game ============ -->
<g>
  <!-- 1 · asks -->
  <rect x="64" y="364" width="228" height="100" rx="10" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
  <circle cx="92" cy="393" r="19" fill="#1f5fd1"/><text x="92" y="400.5" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">1</text>
  <text x="120" y="400" font-size="20" font-weight="700" fill="#1c1c1c">Asks the agent</text>
  <text x="80" y="430" class="m" font-size="14.5" fill="#4a4a4a">DecideAsync(</text>
  <text x="80" y="452" class="m" font-size="14.5" fill="#4a4a4a" xml:space="preserve">  "Go to the tower.")</text>

  <!-- game state: read by step 3 -->
  <rect x="64" y="489" width="228" height="225" rx="10" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
  <text x="80" y="520" font-size="20" font-weight="700" fill="#1c1c1c">Game state</text>
  <use href="#lol" x="80" y="539" width="26" height="14"/>
  <text x="110" y="550" class="m" font-size="14.5" fill="#4a4a4a">IActionHandler</text>
  <text x="80" y="575" class="m" font-size="14.5" fill="#4a4a4a">IsAvailable()</text>
  <text x="198" y="575" font-size="15" fill="#7f7f7f">legal now?</text>
  <text x="80" y="599" class="m" font-size="14.5" fill="#4a4a4a">Execute()</text>
  <text x="164" y="599" font-size="15" fill="#7f7f7f">runs it</text>
  <text x="80" y="636" font-size="15.5" font-weight="700" fill="#4a4a4a">Targetable objects</text>
  <text x="80" y="660" class="m" font-size="14.5" fill="#4a4a4a">tower · bridge ·</text>
  <text x="80" y="682" class="m" font-size="14.5" fill="#4a4a4a">training_dummy</text>

  <!-- the demo games are instances of "your game" -->
  <rect x="64" y="739" width="228" height="225" rx="10" fill="none" stroke="#c2c2c2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="766" font-size="13" font-weight="700" letter-spacing="1.6" fill="#7f7f7f">OUR DEMO GAMES</text>
  <text x="80" y="794" font-size="17" font-weight="700" fill="#4a4a4a">GreyBoxVillage</text>
  <text x="80" y="816" font-size="15" fill="#4a4a4a">a guard you talk to</text>
  <text x="80" y="848" font-size="17" font-weight="700" fill="#4a4a4a">GreyBoxStrategy</text>
  <text x="80" y="870" font-size="15" fill="#4a4a4a">countries as agents</text>
  <text x="80" y="902" font-size="15" fill="#7f7f7f">CompanionRPG · GreyBox2D</text>
  <text x="80" y="932" font-size="14" fill="#7f7f7f">each its own Unity project,</text>
  <text x="80" y="952" font-size="14" fill="#7f7f7f">public API only</text>

  <!-- 9 · acts -->
  <rect x="64" y="989" width="228" height="100" rx="10" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
  <circle cx="92" cy="1018" r="19" fill="#1f5fd1"/><text x="92" y="1025.5" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">9</text>
  <text x="120" y="1025" font-size="20" font-weight="700" fill="#1c1c1c">Acts on it</text>
  <text x="80" y="1055" class="m" font-size="14.5" fill="#4a4a4a">Execute(result)</text>
  <text x="80" y="1077" font-size="15" fill="#4a4a4a">handler walks to the tower</text>
</g>

<!-- ============ the model ============ -->
<g>
  <text x="988" y="384" font-size="13" font-weight="700" letter-spacing="1.6" fill="#7f7f7f">IT GETS</text>
  <text x="988" y="410" font-size="16" fill="#4a4a4a">a prompt, plus a grammar</text>
  <text x="988" y="432" font-size="16" fill="#4a4a4a">that lets it write only</text>

  <circle cx="1016" cy="757" r="19" fill="#1f5fd1"/><text x="1016" y="764.5" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">6</text>
  <text x="1044" y="764" font-size="20" font-weight="700" fill="#1c1c1c">Chooses</text>

  <text x="1004" y="808" font-size="18" font-weight="700" fill="#4a4a4a">Ollama</text>
  <text x="1004" y="830" font-size="15" fill="#4a4a4a">local server · development</text>
  <line x1="1000" y1="848" x2="1204" y2="848" stroke="#dcdcdc" stroke-width="1.5"/>
  <text x="1004" y="874" font-size="18" font-weight="700" fill="#4a4a4a">In-process</text>
  <text x="1004" y="896" font-size="15" fill="#4a4a4a">llama.cpp inside the game</text>
  <line x1="1000" y1="914" x2="1204" y2="914" stroke="#dcdcdc" stroke-width="1.5"/>
  <text x="1004" y="940" font-size="18" font-weight="700" fill="#4a4a4a">Cloud API</text>
  <text x="1004" y="962" font-size="15" fill="#4a4a4a">Gemini first · optional</text>

  <text x="988" y="1024" font-size="13" font-weight="700" letter-spacing="1.6" fill="#7f7f7f">IT NEVER</text>
  <text x="988" y="1050" font-size="16" fill="#4a4a4a">touches the game</text>
  <text x="988" y="1072" font-size="16" fill="#4a4a4a">or the scene</text>
</g>

  <rect x="448" y="1136" width="384" height="96" rx="10" fill="#fff" stroke="#4a4a4a" stroke-width="2"/>
