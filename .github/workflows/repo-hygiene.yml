name: Repo hygiene

# Every check lives in tools/ci/hygiene.py, which says what each one catches and why, and
# which runs the same checks on your own machine:
#
#     python tools/ci/hygiene.py
#
# This file only calls it, one step per check, so a failure names its check in the run's
# summary. Deliberately no Unity: Unity in CI needs licence activation, which the build plan
# defers to Phase 3 (section 6.3), so nothing here compiles C# or runs a test.
#
# The job's name, "Hygiene checks", is the status check branch protection requires on test
# and main. Renaming it makes every pull request wait for a check that never arrives.

on:
  pull_request:
    branches: [test, main]
    # "edited" so that fixing a pull request's description re-runs the attribution check;
    # a manual re-run replays the original event, old description included.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [test, main]

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the guid and attribution checks read the commits being compared

      - name: List the checks
        run: python3 tools/ci/hygiene.py --list

      - name: No generated or secret files committed
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py generated

      - name: JSON and asmdef files parse
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py json

      - name: Package manifests are well formed
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py packages

      - name: Test assemblies are excluded from player builds
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py test-asmdefs

      - name: Unity .meta files are in sync
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py meta

      - name: Existing .meta files keep their GUIDs
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py guids

      - name: Binary files go through Git LFS
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py lfs

      - name: .gitignore ignores no tracked file
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py gitignore

      - name: Every Unity project uses the pinned Unity version
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py unity-version

      - name: Demo projects load the framework from this repo
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py framework-ref

      - name: Only Runtime/Unity/ touches a scene
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py scene

      - name: The framework depends on nothing beyond Newtonsoft
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py dependency

      - name: Links between docs resolve
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py links

      - name: Python probes lint, and no API key sits in a URL
        if: ${{ !cancelled() }}
        run: python3 tools/ci/hygiene.py probes

      - name: No attribution lines in commits or the description
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 tools/ci/hygiene.py attribution
