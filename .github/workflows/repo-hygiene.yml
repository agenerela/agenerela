name: Repo hygiene

# Deliberately does NOT run Unity tests. Unity in CI needs licence activation, which is a
# known time sink, and the build plan defers it to Phase 3 (§6.3). Everything here runs in
# seconds on a plain runner and catches the mistakes that actually happen in a Unity repo:
# committed generated files, broken JSON, missing .meta files, a .meta regenerated with a new
# GUID, a .gitignore rule that hides files the repo tracks, and scene code leaking into the
# part of the framework an agent with no scene has to be able to run. It also holds the hard
# rules that a machine can check (AGENTS.md): one dependency, no attribution lines, no key in
# a URL - and the two checks section 6.3 asks for before Phase 3: doc links resolve, and the
# Python probes lint.
#
# Unity EditMode tests get added at Phase 3, once there is a test suite worth protecting.
#
# The repo holds several Unity projects: UnityProject/, the framework's dev project, and one
# per demo game under Demos/ (DR-010 in the build plan). The first step finds them all, and
# every check after it runs on each, so a new game project is covered the moment its
# ProjectSettings/ is committed. Nothing here needs editing when a game is added.

on:
  pull_request:
    branches: [test, main]
    # "edited" so that fixing a pull request's description re-runs the attribution check;
    # a manual re-run replays the original event, old description included.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [test, main]

permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the attribution check reads every commit in the pull request

      # ---------------------------------------------------------------- discovery
      - name: Find Unity projects and packages
        run: |
          # A Unity project is any folder with a committed ProjectSettings/ProjectVersion.txt.
          # A package is any folder with a package.json outside a project's Assets/. Later
          # steps read both lists from the environment, one path per line.
          projects=$(git ls-files '*/ProjectSettings/ProjectVersion.txt' | sed 's#/ProjectSettings/ProjectVersion.txt$##')
          packages=$(git ls-files '*/package.json' | { grep -v '/Assets/' || true; } | sed 's#/package.json$##')
          echo "Unity projects:"; echo "$projects" | sed 's/^/    /'
          echo "Packages:";       echo "$packages" | sed 's/^/    /'
          {
            echo 'UNITY_PROJECTS<<EOF'; echo "$projects"; echo 'EOF'
            echo 'UNITY_PACKAGES<<EOF'; echo "$packages"; echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Find the commit this run compares against
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TARGET: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The .meta and GUID steps below ask what this run changed. A pull request counts
          # from where it left its target branch (what "base...head" means to git), so what
          # landed on the target since is not blamed on it. A push counts from the commit the
          # branch pointed at before. A new branch has nothing to count from. RESTORE_FROM is
          # what an error tells the author to restore a file from.
          base=; head=; from=
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD") || base=
            head=$PR_HEAD; from="origin/$PR_TARGET"
          elif [ -n "${BEFORE//0/}" ]; then   # all zeros: the push created the branch
            # After a force-push the old commit is on no branch, so the checkout did not fetch it.
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --quiet --no-tags origin "$BEFORE" || true
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base=$BEFORE; head=$AFTER; from=${BEFORE:0:12}
            fi
          fi
          if [ -n "$base" ]; then
            echo "Comparing $base..$head"
          else
            echo "::warning::No earlier commit to compare with, so the GUID step has nothing to check."
          fi
          { echo "COMPARE_BASE=$base"; echo "COMPARE_HEAD=$head"; echo "RESTORE_FROM=${from:-origin/test}"; } >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- generated files
      - name: No generated or secret files committed
        run: |
          fail=0
          check() {
            found=$(git ls-files "$1" | head -5) || true
            if [ -n "$found" ]; then
              echo "::error::$2"
              echo "$found" | sed 's/^/    /'
              fail=1
            fi
          }
          while IFS= read -r p; do
            check "$p/Library/**"      "$p/Library/ is committed. It is generated by Unity and must never be tracked."
            check "$p/Logs/**"         "$p/Logs/ is committed."
            check "$p/UserSettings/**" "$p/UserSettings/ is committed."
            check "$p/Temp/**"         "$p/Temp/ is committed."
          done <<< "$UNITY_PROJECTS"
          check '**/*.csproj'                  'A .csproj is committed. These are generated by Unity per-machine.'
          check '**/*.sln'                     'A .sln is committed.'
          check '**/*.slnx'                    'A .slnx is committed.'
          check '.env'                         'A .env file is committed. Rotate the keys in it immediately, then remove it from history.'
          [ "$fail" -eq 0 ] && echo "OK: no generated or secret files tracked"
          exit $fail

      # ---------------------------------------------------------------- json / asmdef
      - name: JSON and asmdef files parse
        run: |
          fail=0
          while IFS= read -r f; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8'))" "$f" 2>/dev/null; then
              echo "::error file=$f::Invalid JSON. A malformed settings or asmdef file fails silently in Unity."
              fail=1
            fi
          done < <(git ls-files '*.json' '*.asmdef' '*.asmref')
          [ "$fail" -eq 0 ] && echo "OK: all JSON and asmdef files parse"
          exit $fail

      # ---------------------------------------------------------------- package manifests
      - name: Package manifests are well formed
        run: |
          python3 - <<'PY'
          import json, os, sys
          fail = False
          for pkg in filter(None, os.environ["UNITY_PACKAGES"].split("\n")):
              p = f"{pkg}/package.json"
              try:
                  d = json.load(open(p, encoding="utf-8"))
              except ValueError:
                  fail = True
                  continue  # the JSON step above reports it
              missing = [k for k in ("name", "version", "displayName", "description", "unity") if not d.get(k)]
              if missing:
                  print(f"::error file={p}::Missing required field(s): {', '.join(missing)}")
                  fail = True
              elif d["name"] != d["name"].lower():
                  print(f"::error file={p}::Package name must be lowercase (Unity requirement).")
                  fail = True
              elif "unity" in d["name"]:
                  print(f"::error file={p}::Package name must not contain 'unity' - Unity forbids it.")
                  fail = True
              else:
                  print(f"OK: {d['name']} {d['version']}")
          sys.exit(1 if fail else 0)
          PY

      # ---------------------------------------------------------------- test asmdefs
      - name: Test assemblies are excluded from player builds
        run: |
          fail=0
          while IFS= read -r f; do
            case "$f" in *Tests*) ;; *) continue ;; esac
            python3 - "$f" <<'PY' || fail=1
          import json, sys
          f = sys.argv[1]
          d = json.load(open(f, encoding="utf-8"))
          if "UNITY_INCLUDE_TESTS" not in (d.get("defineConstraints") or []):
              print(f'::error file={f}::Test assembly is missing defineConstraints ["UNITY_INCLUDE_TESTS"]. '
                    f'Without it the assembly compiles into player builds and fails there.')
              sys.exit(1)
          if "nunit.framework.dll" not in (d.get("precompiledReferences") or []):
              print(f'::error file={f}::Test assembly is missing precompiledReferences ["nunit.framework.dll"].')
              sys.exit(1)
          PY
          done < <(git ls-files '*.asmdef')
          [ "$fail" -eq 0 ] && echo "OK: test assemblies correctly constrained"
          exit $fail

      # ---------------------------------------------------------------- .meta parity
      - name: Unity .meta files are in sync
        run: |
          # A missing .meta means Unity regenerates it with a NEW guid on someone else's
          # machine, silently breaking every reference to that asset. An orphaned .meta
          # means a file was deleted without its metadata. Both are classic team bugs.
          #
          # Checked under every project's Assets/ and every package folder. Unity ignores
          # hidden names and folders ending in ~ (Samples~, Documentation~), and so does this.
          #
          # The fix for a missing .meta depends on whether the asset is new. An existing one
          # must get its committed .meta back: the copy Unity regenerates carries a new guid,
          # which passes this step and breaks the same references (the GUID step catches it).
          python3 - <<'PY'
          import os, posixpath, shlex, subprocess, sys
          tracked = [f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                               text=True, check=True).stdout.split("\0") if f]
          files = set(tracked)
          folders = set()
          for f in tracked:
              d = posixpath.dirname(f)
              while d and d not in folders:
                  folders.add(d)
                  d = posixpath.dirname(d)

          roots = [p + "/Assets" for p in os.environ["UNITY_PROJECTS"].split("\n") if p]
          roots += [p for p in os.environ["UNITY_PACKAGES"].split("\n") if p]

          def ignored(rel):
              return any(part.startswith(".") or part.endswith("~") for part in rel.split("/"))

          base, restore = os.environ.get("COMPARE_BASE"), os.environ.get("RESTORE_FROM") or "origin/test"
          before = set(subprocess.run(["git", "ls-tree", "-r", "--name-only", "-z", base], capture_output=True,
                                      text=True, check=True).stdout.split("\0")) if base else set()

          restorable = []

          def remedy(meta):
              cmd = f"git checkout {restore} -- {shlex.quote(meta)}"
              if meta in before:
                  restorable.append(meta)
                  return (f"Do not commit the copy Unity regenerates: its guid is new, so the references break all "
                          f"the same. Restore the committed one from {restore}: {cmd}")
              if base:
                  return "This is a new asset: open its project in Unity, then commit the .meta Unity creates for it."
              return (f"If this is a new asset, open its project in Unity, then commit the .meta Unity creates for it. "
                      f"If it already existed, restore the committed .meta rather than a regenerated one: {cmd}")

          errors = []
          need = set()
          for root in roots:
              for f in tracked:
                  if not f.startswith(root + "/") or f.endswith(".meta"):
                      continue
                  rel = f[len(root) + 1:]
                  if ignored(rel):
                      continue
                  if f + ".meta" not in files:
                      errors.append(f"::error file={f}::Missing {f}.meta - Unity will regenerate it with a new guid and "
                                    f"break references. {remedy(f + '.meta')}")
                  # Folders carry a .meta too, but git tracks only files. Every folder between
                  # the root and the file needs one; the root itself has none.
                  d = posixpath.dirname(rel)
                  while d:
                      need.add(f"{root}/{d}")
                      d = posixpath.dirname(d)
          for d in sorted(need):
              if d + ".meta" not in files:
                  errors.append(f"::error::Missing {d}.meta - Unity will regenerate the folder's guid on every "
                                f"machine. {remedy(d + '.meta')}")

          for m in tracked:
              if not m.endswith(".meta"):
                  continue
              asset = m[:-len(".meta")]
              if asset not in files and asset not in folders:
                  errors.append(f"::error file={m}::Orphaned .meta - the asset it describes is not tracked.")
              elif not any(m.startswith(r + "/") for r in roots):
                  errors.append(f"::error file={m}::This .meta is outside every Unity project and package. "
                                f"If it belongs to a new project, commit that project's ProjectSettings/ too, "
                                f"or none of its files are checked.")

          # GitHub shows a step's first ten annotations only, so the fix for them all goes first.
          if len(restorable) > 1:
              errors.insert(0, f"::error::{len(restorable)} committed .meta files are missing. Restore them all at "
                               f"once: git checkout {restore} -- {' '.join(shlex.quote(m) for m in restorable)}")
          print("\n".join(errors) if errors else "OK: .meta files in sync")
          sys.exit(1 if errors else 0)
          PY

      # ---------------------------------------------------------------- guid stability
      - name: Existing .meta files keep their GUIDs
        run: |
          # The step above checks that every asset HAS a .meta, not that it is the SAME one.
          # Delete the metas, let Unity regenerate them and commit the copies, and that step
          # passes while every scene, setting and asset that referred to the old GUIDs points
          # at nothing: the render pipeline, the build's scene list, a scene's volume profile.
          # Unity shows no error until someone opens the thing that broke, and the rest of this
          # workflow stays green - that happened to 40 metas in one pull request.
          #
          # So a tracked .meta whose guid changed fails, and so does an asset moved to another
          # folder whose .meta Unity regenerated there (part 2 below). An asset moved together
          # with its .meta keeps its guid and passes, and a new asset has no old guid to compare.
          python3 - <<'PY'
          import collections, os, posixpath, re, shlex, subprocess, sys

          base, head = os.environ.get("COMPARE_BASE"), os.environ.get("COMPARE_HEAD")
          restore = os.environ.get("RESTORE_FROM") or "origin/test"
          if not base:
              print("OK: no earlier commit to compare with, so no guid can have changed")
              sys.exit(0)

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True, encoding="utf-8",
                                    check=True).stdout

          def guid(rev, path):
              m = re.search(r"^guid:\s*(\w+)", git("show", f"{rev}:{path}"), re.M)
              return m.group(1) if m else None

          # 1. A .meta rewritten in place. -G keeps the metas whose diff touches a guid line;
          # comparing the values then drops a line that was rewritten with the same guid.
          candidates = [f for f in git("diff", "--diff-filter=M", "-G^guid:", "--name-only", "-z",
                                       base, head, "--", "*.meta").split("\0") if f]
          changed = [(f, guid(base, f), guid(head, f)) for f in candidates]
          changed = [c for c in changed if c[1] != c[2]]

          # 2. An asset moved to another folder with a .meta Unity regenerated there. Git records
          # that as a delete and an add, so part 1 never sees it. Git's rename detection is no help:
          # it pairs .meta files by their text, and two unrelated assets' .meta files are often
          # closer to each other than a regenerated one is to its original. So moves are paired
          # here from the assets themselves: a deleted file and an added file are the same asset
          # when they have the same file name AND the same content. Requiring both keeps a new
          # asset that merely shares a name from failing this step; the price is that a file moved
          # and edited in the same change is not checked. An identical file with the same name
          # cannot be told apart from a move, so asking it to keep its guid can only help.
          # A folder counts as moved when a file inside it moved to the same place inside a folder
          # of the same name. That is what moving a folder outside Unity does: its .meta sits
          # beside it, stays behind, and Unity makes a new one at the destination.
          deleted, added = {}, {}
          raw = git("diff", "--raw", "--no-renames", "--no-abbrev", "-z", base, head).split("\0")
          for info, path in zip(raw[0::2], raw[1::2]):
              _, _, old_blob, new_blob, status = info.split()
              if status == "D":
                  deleted[path] = old_blob
              elif status == "A":
                  added[path] = new_blob

          same_asset = collections.defaultdict(lambda: ([], []))
          for side, files in ((0, deleted), (1, added)):
              for path, blob in files.items():
                  if not path.endswith(".meta"):
                      same_asset[(posixpath.basename(path), blob)][side].append(path)
          pairs = [(o, n) for olds, news in same_asset.values() for o in olds for n in news]
          for o, n in list(pairs):
              while True:
                  o, n = posixpath.dirname(o), posixpath.dirname(n)
                  if not o or not n or posixpath.basename(o) != posixpath.basename(n):
                      break
                  pairs.append((o, n))

          # Each added .meta, and the deleted ones it may have replaced. Several identical files
          # with the same name moving at once give several candidates; matching any one is a move.
          moves = collections.defaultdict(set)
          for o, n in pairs:
              if o + ".meta" in deleted and n + ".meta" in added:
                  moves[n + ".meta"].add(o + ".meta")
          moved = []
          for new_meta, old_metas in sorted(moves.items()):
              olds = {m: guid(base, m) for m in sorted(old_metas)}
              new = guid(head, new_meta)
              if new not in olds.values():
                  old_meta, old = next(iter(olds.items()))
                  moved.append((old_meta, new_meta, old, new))

          if not changed and not moved:
              print(f"OK: every existing .meta keeps its guid ({len(candidates)} touched a guid line, "
                    f"{len(moves)} moved with their asset)")
              sys.exit(0)

          # Summaries go first: GitHub shows only the first ten annotations of a step.
          if changed:
              everything = " ".join(shlex.quote(f) for f, _, _ in changed)
              print(f"::error::{len(changed)} existing .meta file(s) changed their guid, which usually means they "
                    f"were deleted and Unity regenerated them. Restore the committed ones: git checkout {restore} -- {everything}")
          if len(moved) > 1:
              print(f"::error::{len(moved)} moved assets got a new .meta at their new path, and with it a new guid. "
                    f"Each annotation below names the old .meta to put back.")
          for f, old, new in changed:
              print(f"::error file={f}::guid changed from {old} to {new}. Unity finds an asset by its guid, so "
                    f"everything that referred to this one now points at nothing, with no error until someone "
                    f"opens it. Restore the committed .meta: git checkout {restore} -- {shlex.quote(f)}")
          # Two commands, joined in prose: Windows PowerShell 5.1 has no &&, and its > would write
          # the .meta as UTF-16, so neither a && chain nor git show > file is safe to paste there.
          for old_meta, new_meta, old, new in moved:
              print(f"::error file={new_meta}::Moved from {old_meta}, but with a new .meta: guid changed from {old} "
                    f"to {new}. Unity finds an asset by its guid, so everything that referred to it now points at "
                    f"nothing, with no error until someone opens it. Put the old .meta at the new path: "
                    f"git checkout {restore} -- {shlex.quote(old_meta)}, then git mv -f {shlex.quote(old_meta)} "
                    f"{shlex.quote(new_meta)}")
          sys.exit(1)
          PY

      # ---------------------------------------------------------------- ignored but tracked
      - name: .gitignore ignores no tracked file
        run: |
          # Git keeps tracking a file after a .gitignore rule starts to match it, so a bad rule
          # changes nothing you can see. The damage is to NEW files: every one the rule
          # matches is silently left out of commits. A "*.meta" rule drops the .meta of every
          # asset created after it, and Unity gives each of those a new guid on every machine.
          # The .meta step above would notice only later, one asset at a time.
          python3 - <<'PY'
          import collections, subprocess, sys

          def git(*args, stdin=None, check=True):
              return subprocess.run(["git", *args], input=stdin, capture_output=True, text=True,
                                    encoding="utf-8", check=check).stdout

          hidden = [f for f in git("ls-files", "-ci", "--exclude-standard", "-z").split("\0") if f]
          if not hidden:
              print("OK: .gitignore ignores no tracked file")
              sys.exit(0)

          # Name the rule responsible. --no-index, or check-ignore skips files that are tracked;
          # it exits 1 when it matches nothing, which the fallback below covers.
          out = git("check-ignore", "-v", "--no-index", "-z", "--stdin", stdin="\0".join(hidden) + "\0",
                    check=False).split("\0")
          rules = collections.defaultdict(list)
          for source, line, pattern, path in zip(*[iter(out)] * 4):
              rules[(source, line, pattern)].append(path)
          unexplained = sorted(set(hidden) - {p for paths in rules.values() for p in paths})
          if unexplained:
              rules[("", "", "")] = unexplained

          for (source, line, pattern), paths in rules.items():
              where = f" file={source},line={line}" if source else ""
              rule = f'The rule "{pattern}"' if pattern else "A .gitignore rule"
              print(f"::error{where}::{rule} ignores {len(paths)} tracked file(s), such as {paths[0]}. Git keeps "
                    f"tracking those, so nothing looks wrong, but every new file the rule matches is silently left "
                    f"out of commits. Remove the rule; or, if the files really should not be tracked, untrack them "
                    f"with git rm --cached <path>.")
              for p in paths[:20]:
                  print(f"    {p}")
              if len(paths) > 20:
                  print(f"    ... and {len(paths) - 20} more")
          sys.exit(1)
          PY

      # ---------------------------------------------------------------- unity version
      - name: Every Unity project uses the pinned Unity version
        run: |
          # One editor version for every project (build plan §6.2). Opening a project in a
          # newer patch rewrites ProjectVersion.txt and can silently upgrade serialized assets.
          version() { sed -n 's/^m_EditorVersion: *//p' "$1/ProjectSettings/ProjectVersion.txt" | tr -d '\r'; }
          pinned=$(version UnityProject)
          fail=0
          while IFS= read -r p; do
            v=$(version "$p")
            if [ "$v" != "$pinned" ]; then
              echo "::error file=$p/ProjectSettings/ProjectVersion.txt::$p is on Unity $v, but UnityProject/ pins $pinned. Every project must use the same version."
              fail=1
            fi
          done <<< "$UNITY_PROJECTS"
          [ "$fail" -eq 0 ] && echo "OK: every Unity project is on $pinned"
          exit $fail

      # ---------------------------------------------------------------- framework reference
      - name: Demo projects load the framework from this repo
        run: |
          # Every project other than UnityProject/ is a demo game (DR-010). It must load the
          # framework through a relative file: path, so it always compiles against the code in
          # this commit. A version or git URL pins a copy, and the game quietly stops testing
          # the framework; an absolute path exists on one machine only.
          python3 - <<'PY'
          import json, os, posixpath, re, sys
          framework = "UnityProject/Packages/com.agenerela.framework"
          demos = [p for p in os.environ["UNITY_PROJECTS"].split("\n") if p and p != "UnityProject"]
          if not demos:
              print("OK: no demo game projects yet")
          fail = False
          for p in demos:
              manifest = f"{p}/Packages/manifest.json"
              expected = "file:" + posixpath.relpath(framework, f"{p}/Packages")
              try:
                  ref = json.load(open(manifest, encoding="utf-8")).get("dependencies", {}).get("com.agenerela.framework")
              except (OSError, ValueError) as e:
                  print(f"::error file={manifest}::Cannot read the project manifest: {e}")
                  fail = True
                  continue
              path = ref[len("file:"):] if ref and ref.startswith("file:") else None
              if ref is None:
                  why = "does not reference the framework"
              elif path is None:
                  why = f'loads the framework from "{ref}", which pins a copy instead of using the code in this repo'
              elif path.startswith("/") or re.match(r"[A-Za-z]:", path):
                  why = f'uses the absolute path "{path}", which exists on one machine only'
              elif posixpath.normpath(posixpath.join(p, "Packages", path)) != framework:
                  why = f'points at "{path}", which is not the framework in this repo'
              else:
                  print(f"OK: {p} loads the framework from {ref}")
                  continue
              print(f'::error file={manifest}::{p} {why}. Use "com.agenerela.framework": "{expected}"')
              fail = True
          sys.exit(1 if fail else 0)
          PY

      # ---------------------------------------------------------------- scene independence
      - name: Only Runtime/Unity/ touches a scene
        run: |
          # An agent must be able to exist with no scene: a country in GreyBoxStrategy has no
          # Transform, and an EditMode test has no scene at all (DR-011, build plan section 1.2).
          # So scene types and calls may appear only under Runtime/Unity/. UnityEngine itself is
          # fine - Awaitable, ScriptableObject and [Tooltip] need no scene.
          #
          # Also: UnityEditor anywhere in Runtime/ must sit inside #if UNITY_EDITOR. Unguarded,
          # it compiles in the editor and breaks every player build, and nothing else here would
          # notice, because CI does not compile Unity yet (section 6.3).
          #
          # Comments and string literals are ignored, so a doc comment may still say GameObject.
          python3 - <<'PY'
          import re, subprocess, sys

          runtime = "UnityProject/Packages/com.agenerela.framework/Runtime/"
          scene_ok = runtime + "Unity/"
          scene = re.compile(
              r"\b(GameObject|MonoBehaviour|Component|Transform|RectTransform|Camera"
              r"|SceneManager|SceneManagement|Physics|Physics2D"
              r"|GetComponents?(?:InChildren|InParent)?|AddComponent"
              r"|Find(?:Any|First)?Objects?(?:Of|By)Type|FindWithTag|FindGameObjectsWithTag)\b")
          editor = re.compile(r"\bUnityEditor\b")

          def code_only(src):
              # Blank out comments, strings and char literals, keeping every newline so line
              # numbers still match. Verbatim strings may span lines; regular ones may not.
              out, i, n = [], 0, len(src)
              blank = lambda t: re.sub(r"[^\n]", " ", t)
              while i < n:
                  c, nx = src[i], src[i + 1:i + 2]
                  if c == "/" and nx == "/":
                      j = src.find("\n", i)
                      j = n if j < 0 else j
                  elif c == "/" and nx == "*":
                      j = src.find("*/", i + 2)
                      j = n if j < 0 else j + 2
                  elif c in "@$" and re.match(r'(@\$?|\$@)"', src[i:i + 3]):
                      j = src.index('"', i) + 1
                      while j < n:
                          if src[j] == '"' and src[j + 1:j + 2] == '"':
                              j += 2
                          elif src[j] == '"':
                              j += 1
                              break
                          else:
                              j += 1
                  elif c == '"' or (c == "$" and nx == '"'):
                      j = i + (2 if c == "$" else 1)
                      while j < n and src[j] not in '"\n':
                          j += 2 if src[j] == "\\" else 1
                      j += 1
                  elif c == "'":
                      j = i + 1
                      j += 2 if src[j:j + 1] == "\\" else 1
                      j = src.find("'", j) + 1 or n
                  else:
                      out.append(c)
                      i += 1
                      continue
                  out.append(blank(src[i:j]))
                  i = j
              return "".join(out)

          def editor_guarded_lines(code):
              # Which lines sit inside a branch that only compiles in the editor. Handles
              # #if UNITY_EDITOR / #if !UNITY_EDITOR with #elif, #else and nesting; any other
              # condition counts as not guarded.
              guarded, stack = set(), []
              for no, line in enumerate(code.split("\n"), 1):
                  d = line.strip()
                  m = re.match(r"#\s*(if|elif|else|endif)\b(.*)", d)
                  if m:
                      kind, cond = m.group(1), m.group(2)
                      if kind == "if":
                          stack.append(["pos" if re.search(r"(?<!!)\bUNITY_EDITOR\b", cond) and "!" not in cond
                                        else "neg" if re.search(r"!\s*UNITY_EDITOR\b", cond) else "other", "if"])
                      elif kind == "elif" and stack:
                          stack[-1] = ["pos" if re.search(r"(?<!!)\bUNITY_EDITOR\b", cond) and "!" not in cond
                                       else "other", "if"]
                      elif kind == "else" and stack:
                          stack[-1][1] = "else"
                      elif kind == "endif" and stack:
                          stack.pop()
                      continue
                  if any((k == "pos" and b == "if") or (k == "neg" and b == "else") for k, b in stack):
                      guarded.add(no)
              return guarded

          files = [f for f in subprocess.run(["git", "ls-files", runtime + "*.cs"], capture_output=True,
                                             text=True, check=True).stdout.split("\n") if f]
          errors = []
          for f in files:
              code = code_only(open(f, encoding="utf-8-sig").read())
              safe = editor_guarded_lines(code)
              for no, line in enumerate(code.split("\n"), 1):
                  if not f.startswith(scene_ok):
                      for m in scene.finditer(line):
                          errors.append(f"::error file={f},line={no}::{m.group(1)} is a scene type or call, and only "
                                        f"Runtime/Unity/ may touch a scene (DR-011, build plan section 1.2). Move this code "
                                        f"there, or rename it if it is not the Unity type.")
                  if no not in safe:
                      for m in editor.finditer(line):
                          errors.append(f"::error file={f},line={no}::UnityEditor outside #if UNITY_EDITOR. It compiles "
                                        f"in the editor and breaks every player build (build plan section 1.2).")
          print("\n".join(errors) if errors else f"OK: {len(files)} runtime files, scene types only under Runtime/Unity/")
          sys.exit(1 if errors else 0)
          PY

      # ---------------------------------------------------------------- one dependency
      - name: The framework depends on nothing beyond Newtonsoft
        run: |
          # Hard rule 6 and DR-009: installing the framework must never pull in a scoped
          # registry or native binaries. package.json may declare only Newtonsoft, and every
          # framework assembly must set overrideReferences and name only Newtonsoft.Json.dll -
          # otherwise a DLL that merely exists in this project compiles here and fails on a
          # user's machine. The plan's own exception is honoured: a provider assembly that
          # compiles only when its dependency is present (a versionDefine used in its
          # defineConstraints, build plan section 1.2) is exempt.
          python3 - <<'PY'
          import json, re, subprocess, sys

          pkg = "UnityProject/Packages/com.agenerela.framework"
          allowed_packages = {"com.unity.nuget.newtonsoft-json"}
          allowed_dlls = {"Newtonsoft.Json.dll"}
          why = "Newtonsoft is the core's one third-party dependency; another needs a decision record first (hard rule 6, DR-009)."
          errors = []

          manifest = json.load(open(f"{pkg}/package.json", encoding="utf-8"))
          for dep in sorted(set(manifest.get("dependencies") or {}) - allowed_packages):
              errors.append(f"::error file={pkg}/package.json::The framework depends on {dep}. {why}")

          asmdefs = [f for f in subprocess.run(["git", "ls-files", f"{pkg}/*.asmdef"], capture_output=True,
                                               text=True, check=True).stdout.split("\n") if f]
          own = set()
          for f in asmdefs:
              own.add(json.load(open(f, encoding="utf-8-sig"))["name"])
              try:
                  guid = re.search(r"^guid:\s*(\w+)", open(f + ".meta", encoding="utf-8").read(), re.M)
                  if guid:
                      own.add("GUID:" + guid.group(1))
              except OSError:
                  pass  # the .meta step reports a missing .meta

          for f in asmdefs:
              if "/Tests/" in f:
                  continue  # editor-only; the test-assembly step checks these
              a = json.load(open(f, encoding="utf-8-sig"))
              # The rule's own exception: a provider that compiles only when its dependency is present.
              defines = {v.get("define") for v in a.get("versionDefines") or []}
              if defines & set(a.get("defineConstraints") or []):
                  print(f"OK: {f} is isolated behind a version define")
                  continue
              if not a.get("overrideReferences"):
                  errors.append(f"::error file={f}::overrideReferences must be true. Without it Unity references every "
                                f"DLL in a user's project, and an undeclared dependency compiles here and fails there (DR-009).")
              for dll in sorted(set(a.get("precompiledReferences") or []) - allowed_dlls):
                  errors.append(f"::error file={f}::References {dll}. {why}")
              for ref in a.get("references") or []:
                  if ref not in own:
                      errors.append(f"::error file={f}::References the assembly {ref}, which is not part of the framework. "
                                    f"If it is a provider's dependency, isolate that provider behind a versionDefine used "
                                    f"in its defineConstraints (build plan section 1.2); otherwise: {why}")
          print("\n".join(errors) if errors else f"OK: {len(asmdefs)} framework assemblies depend on nothing beyond Newtonsoft")
          sys.exit(1 if errors else 0)
          PY

      # ---------------------------------------------------------------- doc links
      - name: Links between docs resolve
        run: |
          # Section 6.3: a markdown link check from Phase 0. Covers every relative link in a
          # tracked .md file and every relative href/src in docs/*.html, resolved against
          # what git tracks - a link to an ignored or untracked file is broken on GitHub even
          # if it opens on your machine. External URLs and #anchors are not followed.
          python3 - <<'PY'
          import html, posixpath, re, subprocess, sys
          from urllib.parse import unquote

          tracked = [f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                               text=True, check=True).stdout.split("\0") if f]
          files = set(tracked)
          folders = set()
          for f in tracked:
              d = posixpath.dirname(f)
              while d and d not in folders:
                  folders.add(d)
                  d = posixpath.dirname(d)

          def targets_md(text):
              # Links inside fenced blocks and inline code are examples, not links.
              text = re.sub(r"^(```|~~~).*?^\1", lambda m: "\n" * m.group(0).count("\n"),
                            text, flags=re.S | re.M)
              text = re.sub(r"`[^`\n]*`", "", text)
              for m in re.finditer(r"\]\(\s*<?([^)\s>]+)>?(?:\s+\"[^\"]*\")?\s*\)", text):
                  yield text.count("\n", 0, m.start()) + 1, m.group(1)
              for m in re.finditer(r"^\s{0,3}\[[^\]]+\]:\s*<?(\S+?)>?(?:\s|$)", text, re.M):
                  yield text.count("\n", 0, m.start()) + 1, m.group(1)

          def targets_html(text):
              text = re.sub(r"<(script|style|pre|code)\b.*?</\1>",
                            lambda m: "\n" * m.group(0).count("\n"), text, flags=re.S | re.I)
              for m in re.finditer(r"\b(?:href|src)\s*=\s*([\"'])(.*?)\1", text, re.I):
                  yield text.count("\n", 0, m.start()) + 1, html.unescape(m.group(2))

          errors, checked = [], 0
          for f in tracked:
              if f.endswith(".md"):
                  found = targets_md(open(f, encoding="utf-8").read())
              elif f.endswith(".html") and f.startswith("docs/"):
                  found = targets_html(open(f, encoding="utf-8").read())
              else:
                  continue
              for line, raw in found:
                  t = raw.strip()
                  if not t or t.startswith(("#", "mailto:", "data:", "javascript:")) or re.match(r"^[a-z][a-z0-9+.-]*://", t, re.I):
                      continue
                  path = unquote(t.split("#", 1)[0].split("?", 1)[0])
                  if not path:
                      continue
                  resolved = posixpath.normpath(path.lstrip("/") if path.startswith("/")
                                                else posixpath.join(posixpath.dirname(f), path))
                  checked += 1
                  if resolved.rstrip("/") not in files and resolved.rstrip("/") not in folders:
                      errors.append(f"::error file={f},line={line}::Broken link: {raw} (resolves to {resolved}, "
                                    f"which is not a tracked file or folder).")
          print("\n".join(errors) if errors else f"OK: {checked} relative links resolve")
          sys.exit(1 if errors else 0)
          PY

      # ---------------------------------------------------------------- probes and keys
      - name: Python probes lint, and no API key sits in a URL
        run: |
          # Section 6.3 asks for probe linting before Phase 3. The probes under tools/ must
          # compile and import only the standard library, as their README promises. And hard
          # rule 1 - keys go in headers - is checked across every .py and .cs file.
          python3 - <<'PY'
          import ast, posixpath, re, subprocess, sys

          def tracked(*patterns):
              return [f for f in subprocess.run(["git", "ls-files", *patterns], capture_output=True,
                                                text=True, check=True).stdout.split("\n") if f]

          errors = []
          probes = tracked("tools/*.py")
          stdlib = set(sys.stdlib_module_names)
          for f in probes:
              src = open(f, encoding="utf-8").read()
              try:
                  tree = compile(src, f, "exec", ast.PyCF_ONLY_AST)
                  compile(tree, f, "exec")
              except SyntaxError as e:
                  errors.append(f"::error file={f},line={e.lineno}::Does not compile: {e.msg}")
                  continue
              siblings = {posixpath.splitext(posixpath.basename(p))[0] for p in probes
                          if posixpath.dirname(p) == posixpath.dirname(f)}
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      mods = [node.module]
                  else:
                      continue
                  for mod in mods:
                      if mod.split(".")[0] not in stdlib | siblings:
                          errors.append(f"::error file={f},line={node.lineno}::Imports {mod}, which is not in the standard "
                                        f"library. The probes promise to run with no pip install (tools/benchmarks/README.md).")

          # Hard rule 1: keys travel in headers. "?key=" is how Gemini's own examples do it, which
          # is exactly why it is worth a check - the key then lands in logs, proxies and history.
          for f in tracked("*.py", "*.cs"):
              for no, line in enumerate(open(f, encoding="utf-8-sig", errors="replace"), 1):
                  if re.search(r"[?&](?:api_?)?key=", line, re.I):
                      errors.append(f"::error file={f},line={no}::An API key in a URL. Send it in a header and redact it from "
                                    f"errors (hard rule 1); a key in a URL ends up in logs, proxies and history.")
          print("\n".join(errors) if errors else f"OK: {len(probes)} probes compile on the standard library alone; no key in any URL")
          sys.exit(1 if errors else 0)
          PY

      # ---------------------------------------------------------------- attribution
      - name: No attribution lines in commits or the description
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Hard rule 7: no Co-Authored-By, no "Generated with <tool>". Claude Code's settings
          # strip them already; every other agent and every human follows the rule only by
          # convention. The description arrives through env, never pasted into the script, so
          # it cannot inject shell or Python.
          python3 - <<'PY'
          import os, re, subprocess, sys

          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          tools = "claude|codex|copilot|cursor|chatgpt|gpt|gemini|aider|windsurf|devin|zed|openai|anthropic"
          trailer = re.compile(r"^\s*(?:co-authored-by\s*:|\W{0,3}\s*generated\s+(?:with|by)\s+\[?(?:" + tools + r")\b)",
                               re.I | re.M)
          errors = []
          log = subprocess.run(["git", "log", "--format=%h%x00%B%x01", f"{os.environ['BASE']}..{os.environ['HEAD']}"],
                               capture_output=True, text=True, encoding="utf-8",
                               errors="replace", check=True).stdout
          commits = [c.strip("\n") for c in log.split("\x01") if c.strip()]
          for c in commits:
              sha, _, body = c.partition("\x00")
              for m in trailer.finditer(body):
                  errors.append(f"::error::Commit {sha} carries an attribution line: \"{m.group(0).strip()}\". "
                                f"Hard rule 7 - the history reads as the team's work. Reword the commit and force-push the branch.")
          for m in trailer.finditer(os.environ.get("PR_BODY") or ""):
              errors.append(f"::error::The pull request description carries an attribution line: \"{m.group(0).strip()}\". "
                            f"Hard rule 7 - edit it out of the description, then re-run this check.")
          print("\n".join(errors) if errors else f"OK: {len(commits)} commits and the description carry no attribution lines")
          sys.exit(1 if errors else 0)
          PY
